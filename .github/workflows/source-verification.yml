name: Source and distribution verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify the action runtime
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(process.versions.node.split('.')[0], '24'); assert.match(fs.readFileSync('action.yml', 'utf8'), /using: node24/);"
      - run: npm ci --ignore-scripts
      - name: Run every unit suite
        run: node --test test/*.test.mjs tests/*.test.mjs
      - run: npm run build
      - name: Verify committed bundle and third-party notices
        run: git diff --exit-code -- dist/index.cjs dist/THIRD_PARTY_NOTICES.txt
